<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 96" width="100%" height="96" role="img" aria-label="LCARS Directive: Project Theta">
  <defs>
    <style>
      .lcars-mono { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; text-transform: uppercase; }
      .lcars-heavy { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; text-transform: uppercase; }
      .lcars-desc { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="960" height="96" fill="#080C14" rx="6" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Left LCARS Accent Pillar -->
  <path d="M 12 84 L 12 18 A 6 6 0 0 1 18 12 L 28 12 A 3 3 0 0 1 31 15 L 31 81 A 3 3 0 0 1 28 84 Z" fill="#B388FF"/>

  <!-- Designation Badge -->
  <rect x="38" y="14" width="62" height="22" rx="3" fill="#B388FF"/>
  <text x="69" y="29" fill="#080C14" class="lcars-heavy" font-size="11" text-anchor="middle" letter-spacing="1">DIR-06</text>

  <!-- Project Title -->
  <text x="110" y="30" fill="#FEFEFE" class="lcars-heavy" font-size="15" letter-spacing="1">PROJECT THETA</text>

  <!-- Classification Tag -->
  <rect x="270" y="14" width="144" height="22" rx="3" fill="#0E1726" stroke="#B388FF" stroke-width="1"/>
  <text x="342" y="29" fill="#B388FF" class="lcars-mono" font-size="9.5" text-anchor="middle" letter-spacing="0.5">AVIONICS &amp; DRIVE</text>

  <!-- Right Access Button -->
  <rect x="790" y="14" width="156" height="22" rx="3" fill="#0E1726" stroke="#B388FF" stroke-width="1"/>
  <text x="868" y="29" fill="#B388FF" class="lcars-mono" font-size="9.5" text-anchor="middle" letter-spacing="0.5">ACCESS REPOSITORY →</text>

  <!-- Description Body (2-line wrapped to prevent cutoff) -->
  <text x="38" y="58" fill="#CBD5E1" class="lcars-desc" font-size="12">
    Precision <tspan fill="#B388FF" font-weight="600">odometric tracking</tspan> and closed-loop autonomous drive control architecture.
  </text>
  <text x="38" y="77" fill="#CBD5E1" class="lcars-desc" font-size="12">
    Engineered for high-velocity competitive robotics with real-time sub-millimeter positional feedback.
  </text>
</svg>
