<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="100%" height="110" role="img" aria-label="LCARS 2500 Console Header">
  <defs>
    <style>
      .lcars-mono { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; text-transform: uppercase; }
      .lcars-heavy { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="110" fill="#080C14" rx="8"/>

  <!-- Top LCARS Primary Arch / Rail -->
  <!-- Left Main Elbow -->
  <path d="M 20 65 L 20 28 A 16 16 0 0 1 36 12 L 170 12 A 4 4 0 0 1 174 16 L 174 34 A 4 4 0 0 1 170 38 L 56 38 A 6 6 0 0 0 50 44 L 50 65 A 4 4 0 0 1 46 69 L 24 69 A 4 4 0 0 1 20 65 Z" fill="#FF9900"/>
  <text x="56" y="29" fill="#080C14" class="lcars-heavy" font-size="16" letter-spacing="1">LCARS 2500</text>

  <!-- Segment 1: Cyan Identifier -->
  <rect x="180" y="12" width="150" height="26" rx="4" fill="#00E5FF"/>
  <text x="190" y="29" fill="#080C14" class="lcars-mono" font-size="12" letter-spacing="1">SYS-OPS // 25.04</text>

  <!-- Segment 2: Peach Stardate -->
  <rect x="336" y="12" width="120" height="26" rx="4" fill="#FFB347"/>
  <text x="346" y="29" fill="#080C14" class="lcars-mono" font-size="12" letter-spacing="0.5">SD 103214.8</text>

  <!-- Segment 3: Teal Registry -->
  <rect x="462" y="12" width="150" height="26" rx="4" fill="#24C7C0"/>
  <text x="472" y="29" fill="#080C14" class="lcars-mono" font-size="12" letter-spacing="0.5">NCC-1701-G</text>

  <!-- Segment 4: Crimson Tactical Alert -->
  <rect x="618" y="12" width="80" height="26" rx="4" fill="#FF2A55"/>
  <text x="626" y="29" fill="#FEFEFE" class="lcars-mono" font-size="11" letter-spacing="1">OMEGA-1</text>

  <!-- Segment 5: Right Rail Extension -->
  <rect x="704" y="12" width="180" height="26" rx="4" fill="#FF9900"/>
  <text x="714" y="29" fill="#080C14" class="lcars-mono" font-size="12" letter-spacing="0.5">SECTOR 001 // SOL</text>

  <!-- Right Terminal Cap -->
  <path d="M 890 12 L 964 12 A 16 16 0 0 1 980 28 L 980 45 A 4 4 0 0 1 976 49 L 956 49 A 4 4 0 0 1 952 45 L 952 42 A 6 6 0 0 0 946 36 L 890 36 A 4 4 0 0 1 886 32 L 886 16 A 4 4 0 0 1 890 12 Z" fill="#00E5FF"/>
  <text x="900" y="29" fill="#080C14" class="lcars-heavy" font-size="14">TITAN.DS</text>

  <!-- Secondary Lower Data Stream -->
  <!-- Left Side Data Blocks -->
  <rect x="20" y="74" width="26" height="14" rx="2" fill="#24C7C0"/>
  <rect x="20" y="91" width="26" height="14" rx="2" fill="#FFB347"/>

  <text x="56" y="85" fill="#00E5FF" class="lcars-mono" font-size="11" letter-spacing="1.5">FLAG OFFICER PERSONAL DOSSIER</text>
  <text x="275" y="85" fill="#64748B" class="lcars-mono" font-size="11">•</text>
  <text x="290" y="85" fill="#FEFEFE" class="lcars-mono" font-size="11" letter-spacing="1">ADMIRAL BLAHBLAH23406</text>
  <text x="495" y="85" fill="#64748B" class="lcars-mono" font-size="11">•</text>
  <text x="510" y="85" fill="#FF9900" class="lcars-mono" font-size="11" letter-spacing="1">FLEET COMMAND &amp; RESEARCH ARCHIVE</text>

  <text x="56" y="102" fill="#64748B" class="lcars-mono" font-size="10" letter-spacing="0.5">ODN LINK: 99.98% NOMINAL</text>
  <text x="235" y="102" fill="#64748B" class="lcars-mono" font-size="10">•</text>
  <text x="250" y="102" fill="#64748B" class="lcars-mono" font-size="10" letter-spacing="0.5">TACTICAL DEFLECTION: ENGAGED</text>
  <text x="450" y="102" fill="#64748B" class="lcars-mono" font-size="10">•</text>
  <text x="465" y="102" fill="#64748B" class="lcars-mono" font-size="10" letter-spacing="0.5">NEURAL CORE: COGNITIVE SYMMETRY LOCKED</text>

  <!-- Right Side Accent Indicators -->
  <rect x="850" y="76" width="38" height="12" rx="2" fill="#FF9900"/>
  <rect x="894" y="76" width="38" height="12" rx="2" fill="#00E5FF"/>
  <rect x="938" y="76" width="38" height="12" rx="2" fill="#FFB347"/>

  <rect x="806" y="93" width="82" height="12" rx="2" fill="#1E293B"/>
  <text x="814" y="102" fill="#24C7C0" class="lcars-mono" font-size="9" letter-spacing="1">STATUS: ONLINE</text>
  <rect x="894" y="93" width="82" height="12" rx="2" fill="#FF2A55"/>
  <text x="902" y="102" fill="#FEFEFE" class="lcars-mono" font-size="9" letter-spacing="1">CLEARANCE: OMEGA</text>
</svg>
