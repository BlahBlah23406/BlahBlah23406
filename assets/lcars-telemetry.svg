<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="240" role="img" aria-label="LCARS Subspace Telemetry and Fleet Flight Metrics">
  <defs>
    <style>
      .lcars-mono { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; text-transform: uppercase; }
      .lcars-heavy { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; text-transform: uppercase; }
      .lcars-data { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Outer Console Frame -->
  <rect width="960" height="240" fill="#080C14" rx="8" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left LCARS Structural Pillar -->
  <path d="M 16 224 L 16 36 A 12 12 0 0 1 28 24 L 64 24 A 4 4 0 0 1 68 28 L 68 220 A 4 4 0 0 1 64 224 Z" fill="#FF9900"/>
  <rect x="74" y="24" width="120" height="18" rx="3" fill="#00E5FF"/>
  <text x="82" y="37" fill="#080C14" class="lcars-mono" font-size="10" letter-spacing="1">ARRAY-47 // OPS</text>
  
  <rect x="200" y="24" width="160" height="18" rx="3" fill="#FFB347"/>
  <text x="208" y="37" fill="#080C14" class="lcars-mono" font-size="10" letter-spacing="1">SUBSPACE TELEMETRY</text>

  <line x1="368" y1="33" x2="620" y2="33" stroke="#24C7C0" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Top Right Header Pills -->
  <rect x="630" y="24" width="130" height="18" rx="3" fill="#24C7C0"/>
  <text x="638" y="37" fill="#080C14" class="lcars-mono" font-size="10" letter-spacing="1">ODN LINK 99.98%</text>

  <rect x="766" y="24" width="110" height="18" rx="3" fill="#FF2A55"/>
  <text x="774" y="37" fill="#FEFEFE" class="lcars-mono" font-size="10" letter-spacing="1">DEFLECTOR 100%</text>

  <rect x="882" y="24" width="62" height="18" rx="3" fill="#FF9900"/>
  <text x="892" y="37" fill="#080C14" class="lcars-mono" font-size="10" letter-spacing="1">ACTIVE</text>

  <!-- Split Divider -->
  <line x1="600" y1="52" x2="600" y2="220" stroke="#1E293B" stroke-width="1.5"/>

  <!-- ==================== LEFT COLUMN: TELEMETRY & RUNTIMES ==================== -->
  
  <!-- Row 1: Neural Compute Core -->
  <g transform="translate(80, 56)">
    <rect x="0" y="2" width="8" height="24" rx="2" fill="#00E5FF"/>
    <text x="16" y="14" fill="#00E5FF" class="lcars-mono" font-size="11" letter-spacing="1">NEURAL COMPUTE ARRAY // COGNITIVE REASONING</text>
    <text x="16" y="27" fill="#94A3B8" class="lcars-data" font-size="9.5">RUNTIME: DEEPSEEK-R1 (REASONING) • QWEN 2.5 (STRUCTURED JSON) • OLLAMA</text>
    <rect x="360" y="5" width="130" height="18" rx="3" fill="#0E1726" stroke="#00E5FF" stroke-width="1"/>
    <!-- Segmented progress -->
    <rect x="364" y="8" width="22" height="12" rx="1" fill="#00E5FF"/>
    <rect x="388" y="8" width="22" height="12" rx="1" fill="#00E5FF"/>
    <rect x="412" y="8" width="22" height="12" rx="1" fill="#00E5FF"/>
    <rect x="436" y="8" width="22" height="12" rx="1" fill="#00E5FF"/>
    <rect x="460" y="8" width="22" height="12" rx="1" fill="#24C7C0"/>
    <text x="498" y="18" fill="#24C7C0" class="lcars-mono" font-size="10">98.4% NOMINAL</text>
  </g>

  <!-- Row 2: Subspace Relay Mesh -->
  <g transform="translate(80, 98)">
    <rect x="0" y="2" width="8" height="24" rx="2" fill="#FF9900"/>
    <text x="16" y="14" fill="#FF9900" class="lcars-mono" font-size="11" letter-spacing="1">SUBSPACE RELAY MESH // AGENT-COMMS (AHRP V1.0)</text>
    <text x="16" y="27" fill="#94A3B8" class="lcars-data" font-size="9.5">PROTOCOL: CONTEXT CAPSULES • WEBSOCKET RELAY • DUAL-BRAIN BLACKBOARD</text>
    <rect x="360" y="5" width="130" height="18" rx="3" fill="#0E1726" stroke="#FF9900" stroke-width="1"/>
    <rect x="364" y="8" width="22" height="12" rx="1" fill="#FF9900"/>
    <rect x="388" y="8" width="22" height="12" rx="1" fill="#FF9900"/>
    <rect x="412" y="8" width="22" height="12" rx="1" fill="#FF9900"/>
    <rect x="436" y="8" width="22" height="12" rx="1" fill="#FFB347"/>
    <rect x="460" y="8" width="22" height="12" rx="1" fill="#FFB347"/>
    <text x="498" y="18" fill="#FFB347" class="lcars-mono" font-size="10">SYNC LOCKED</text>
  </g>

  <!-- Row 3: Swarm Dispatch & Agentropolis -->
  <g transform="translate(80, 140)">
    <rect x="0" y="2" width="8" height="24" rx="2" fill="#24C7C0"/>
    <text x="16" y="14" fill="#24C7C0" class="lcars-mono" font-size="11" letter-spacing="1">SWARM ORCHESTRATION // AGENTROPOLIS LIVING GRID</text>
    <text x="16" y="27" fill="#94A3B8" class="lcars-data" font-size="9.5">DISPATCH: AUTONOMOUS AGENT NODES • REAL-TIME PAYLOAD VEHICLES</text>
    <rect x="360" y="5" width="130" height="18" rx="3" fill="#0E1726" stroke="#24C7C0" stroke-width="1"/>
    <rect x="364" y="8" width="22" height="12" rx="1" fill="#24C7C0"/>
    <rect x="388" y="8" width="22" height="12" rx="1" fill="#24C7C0"/>
    <rect x="412" y="8" width="22" height="12" rx="1" fill="#24C7C0"/>
    <rect x="436" y="8" width="22" height="12" rx="1" fill="#24C7C0"/>
    <rect x="460" y="8" width="22" height="12" rx="1" fill="#00E5FF"/>
    <text x="498" y="18" fill="#00E5FF" class="lcars-mono" font-size="10">GRID OPTIMAL</text>
  </g>

  <!-- Row 4: Guidance & Avionics -->
  <g transform="translate(80, 182)">
    <rect x="0" y="2" width="8" height="24" rx="2" fill="#FFB347"/>
    <text x="16" y="14" fill="#FFB347" class="lcars-mono" font-size="11" letter-spacing="1">AVIONICS &amp; GUIDANCE ARRAYS // PROJECT ASGARD &amp; THETA</text>
    <text x="16" y="27" fill="#94A3B8" class="lcars-data" font-size="9.5">DRIVE: ODOMETRIC TRAJECTORY GENERATION • HIGH-PRECISION MOTION KINEMATICS</text>
    <rect x="360" y="5" width="130" height="18" rx="3" fill="#0E1726" stroke="#FFB347" stroke-width="1"/>
    <rect x="364" y="8" width="22" height="12" rx="1" fill="#FFB347"/>
    <rect x="388" y="8" width="22" height="12" rx="1" fill="#FFB347"/>
    <rect x="412" y="8" width="22" height="12" rx="1" fill="#FFB347"/>
    <rect x="436" y="8" width="22" height="12" rx="1" fill="#FF9900"/>
    <rect x="460" y="8" width="22" height="12" rx="1" fill="#FF9900"/>
    <text x="498" y="18" fill="#FF9900" class="lcars-mono" font-size="10">VECTOR LOCK</text>
  </g>

  <!-- ==================== RIGHT COLUMN: STARFLEET STRATEGIC METRICS ==================== -->
  <g transform="translate(620, 56)">
    <rect x="0" y="0" width="140" height="18" rx="3" fill="#1E293B"/>
    <text x="8" y="13" fill="#FF9900" class="lcars-mono" font-size="10" letter-spacing="1">OPERATIONAL PROFILE</text>

    <!-- Stat Block 1: Rank & Commission -->
    <g transform="translate(0, 28)">
      <text x="0" y="10" fill="#64748B" class="lcars-mono" font-size="9">COMMISSION LEVEL</text>
      <text x="0" y="28" fill="#FF9900" class="lcars-heavy" font-size="18" letter-spacing="1">FLEET ADMIRAL</text>
      <text x="0" y="42" fill="#94A3B8" class="lcars-data" font-size="9">CLEARANCE: OMEGA-1 // LEVEL 10</text>
    </g>

    <!-- Stat Block 2: Operations Scope -->
    <g transform="translate(170, 28)">
      <text x="0" y="10" fill="#64748B" class="lcars-mono" font-size="9">ACTIVE FLEET DIRECTIVES</text>
      <text x="0" y="28" fill="#00E5FF" class="lcars-heavy" font-size="18" letter-spacing="1">06 ARMED</text>
      <text x="0" y="42" fill="#94A3B8" class="lcars-data" font-size="9">ALL INITIATIVES NOMINAL</text>
    </g>

    <!-- Lower Status Indicators -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="150" height="34" rx="4" fill="#0E1726" stroke="#24C7C0" stroke-width="1"/>
      <text x="10" y="14" fill="#64748B" class="lcars-mono" font-size="8.5">STATION ASSIGNMENT</text>
      <text x="10" y="28" fill="#24C7C0" class="lcars-mono" font-size="10.5" letter-spacing="0.5">SECTOR 001 // SOL</text>

      <rect x="160" y="0" width="150" height="34" rx="4" fill="#0E1726" stroke="#FF2A55" stroke-width="1"/>
      <text x="170" y="14" fill="#64748B" class="lcars-mono" font-size="8.5">FLAGSHIP POSTING</text>
      <text x="170" y="28" fill="#FF2A55" class="lcars-mono" font-size="10.5" letter-spacing="0.5">U.S.S. ENTERPRISE-G</text>
    </g>

    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="310" height="26" rx="4" fill="#0E1726" stroke="#1E293B" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#24C7C0"/>
      <text x="26" y="17" fill="#94A3B8" class="lcars-mono" font-size="9.5" letter-spacing="0.5">LIVE SENSOR MESH: CONTIGUOUS MONITORING NOMINAL</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="20" y="232" width="60" height="4" rx="2" fill="#FF9900"/>
  <rect x="85" y="232" width="220" height="4" rx="2" fill="#00E5FF"/>
  <rect x="310" y="232" width="140" height="4" rx="2" fill="#FFB347"/>
  <rect x="455" y="232" width="40" height="4" rx="2" fill="#FF2A55"/>
  <rect x="500" y="232" width="300" height="4" rx="2" fill="#24C7C0"/>
  <rect x="805" y="232" width="135" height="4" rx="2" fill="#FF9900"/>
</svg>
