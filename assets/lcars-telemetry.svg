<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="320" role="img" aria-label="LCARS Subspace Telemetry and Fleet Flight Metrics">
  <defs>
    <style>
      .lcars-mono { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; text-transform: uppercase; }
      .lcars-heavy { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; text-transform: uppercase; }
      .lcars-data { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Outer Console Frame -->
  <rect width="960" height="320" fill="#080C14" rx="8" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Left LCARS Structural Pillar -->
  <path d="M 16 304 L 16 36 A 12 12 0 0 1 28 24 L 64 24 A 4 4 0 0 1 68 28 L 68 300 A 4 4 0 0 1 64 304 Z" fill="#FF9900"/>
  
  <!-- Top Rail Elements -->
  <rect x="74" y="24" width="130" height="18" rx="3" fill="#00E5FF"/>
  <text x="82" y="37" fill="#080C14" class="lcars-mono" font-size="10" letter-spacing="1">ARRAY-47 // OPS</text>
  
  <rect x="210" y="24" width="160" height="18" rx="3" fill="#FFB347"/>
  <text x="218" y="37" fill="#080C14" class="lcars-mono" font-size="10" letter-spacing="1">SUBSPACE TELEMETRY</text>

  <line x1="376" y1="33" x2="610" y2="33" stroke="#24C7C0" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Top Right Header Pills -->
  <rect x="620" y="24" width="130" height="18" rx="3" fill="#24C7C0"/>
  <text x="628" y="37" fill="#080C14" class="lcars-mono" font-size="10" letter-spacing="1">ODN LINK 99.98%</text>

  <rect x="756" y="24" width="120" height="18" rx="3" fill="#FF2A55"/>
  <text x="764" y="37" fill="#FEFEFE" class="lcars-mono" font-size="10" letter-spacing="1">DEFLECTOR 100%</text>

  <rect x="882" y="24" width="62" height="18" rx="3" fill="#FF9900"/>
  <text x="892" y="37" fill="#080C14" class="lcars-mono" font-size="10" letter-spacing="1">ACTIVE</text>

  <!-- Clear Gutter Split Divider -->
  <line x1="540" y1="56" x2="540" y2="300" stroke="#1E293B" stroke-width="1.5"/>

  <!-- ==================== LEFT COLUMN: SPACIOUS TELEMETRY ROWS ==================== -->
  
  <!-- Row 1: Neural Compute Core -->
  <g transform="translate(80, 58)">
    <text x="0" y="12" fill="#00E5FF" class="lcars-mono" font-size="11" letter-spacing="1">NEURAL COMPUTE ARRAY // COGNITIVE REASONING</text>
    <text x="440" y="12" fill="#24C7C0" class="lcars-mono" font-size="10" text-anchor="end">98.4% NOMINAL</text>
    <!-- Segmented gauge -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="48" height="6" rx="2" fill="#00E5FF"/>
      <rect x="54" y="0" width="48" height="6" rx="2" fill="#00E5FF"/>
      <rect x="108" y="0" width="48" height="6" rx="2" fill="#00E5FF"/>
      <rect x="162" y="0" width="48" height="6" rx="2" fill="#00E5FF"/>
      <rect x="216" y="0" width="48" height="6" rx="2" fill="#24C7C0"/>
      <rect x="270" y="0" width="48" height="6" rx="2" fill="#24C7C0"/>
      <rect x="324" y="0" width="48" height="6" rx="2" fill="#1E293B"/>
      <rect x="378" y="0" width="62" height="6" rx="2" fill="#1E293B"/>
    </g>
    <text x="0" y="36" fill="#94A3B8" class="lcars-data" font-size="9">RUNTIME: DEEPSEEK-R1 (REASONING) • QWEN 2.5 • OLLAMA</text>
  </g>

  <!-- Row 2: Subspace Relay Mesh -->
  <g transform="translate(80, 120)">
    <text x="0" y="12" fill="#FF9900" class="lcars-mono" font-size="11" letter-spacing="1">SUBSPACE RELAY MESH // AGENT-COMMS (AHRP V1.0)</text>
    <text x="440" y="12" fill="#FFB347" class="lcars-mono" font-size="10" text-anchor="end">SYNC LOCKED</text>
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="48" height="6" rx="2" fill="#FF9900"/>
      <rect x="54" y="0" width="48" height="6" rx="2" fill="#FF9900"/>
      <rect x="108" y="0" width="48" height="6" rx="2" fill="#FF9900"/>
      <rect x="162" y="0" width="48" height="6" rx="2" fill="#FFB347"/>
      <rect x="216" y="0" width="48" height="6" rx="2" fill="#FFB347"/>
      <rect x="270" y="0" width="48" height="6" rx="2" fill="#FFB347"/>
      <rect x="324" y="0" width="48" height="6" rx="2" fill="#FFB347"/>
      <rect x="378" y="0" width="62" height="6" rx="2" fill="#1E293B"/>
    </g>
    <text x="0" y="36" fill="#94A3B8" class="lcars-data" font-size="9">PROTOCOL: CONTEXT CAPSULES • WEBSOCKET RELAY • BLACKBOARD</text>
  </g>

  <!-- Row 3: Swarm Dispatch -->
  <g transform="translate(80, 182)">
    <text x="0" y="12" fill="#24C7C0" class="lcars-mono" font-size="11" letter-spacing="1">SWARM ORCHESTRATION // AGENTROPOLIS</text>
    <text x="440" y="12" fill="#00E5FF" class="lcars-mono" font-size="10" text-anchor="end">GRID OPTIMAL</text>
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="48" height="6" rx="2" fill="#24C7C0"/>
      <rect x="54" y="0" width="48" height="6" rx="2" fill="#24C7C0"/>
      <rect x="108" y="0" width="48" height="6" rx="2" fill="#24C7C0"/>
      <rect x="162" y="0" width="48" height="6" rx="2" fill="#24C7C0"/>
      <rect x="216" y="0" width="48" height="6" rx="2" fill="#00E5FF"/>
      <rect x="270" y="0" width="48" height="6" rx="2" fill="#00E5FF"/>
      <rect x="324" y="0" width="48" height="6" rx="2" fill="#00E5FF"/>
      <rect x="378" y="0" width="62" height="6" rx="2" fill="#1E293B"/>
    </g>
    <text x="0" y="36" fill="#94A3B8" class="lcars-data" font-size="9">DISPATCH: AUTONOMOUS AGENT NODES • PAYLOAD ROUTING</text>
  </g>

  <!-- Row 4: Guidance & Avionics -->
  <g transform="translate(80, 244)">
    <text x="0" y="12" fill="#FFB347" class="lcars-mono" font-size="11" letter-spacing="1">AVIONICS &amp; GUIDANCE // ASGARD &amp; THETA</text>
    <text x="440" y="12" fill="#FF9900" class="lcars-mono" font-size="10" text-anchor="end">VECTOR LOCK</text>
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="48" height="6" rx="2" fill="#FFB347"/>
      <rect x="54" y="0" width="48" height="6" rx="2" fill="#FFB347"/>
      <rect x="108" y="0" width="48" height="6" rx="2" fill="#FFB347"/>
      <rect x="162" y="0" width="48" height="6" rx="2" fill="#FF9900"/>
      <rect x="216" y="0" width="48" height="6" rx="2" fill="#FF9900"/>
      <rect x="270" y="0" width="48" height="6" rx="2" fill="#FF9900"/>
      <rect x="324" y="0" width="48" height="6" rx="2" fill="#1E293B"/>
      <rect x="378" y="0" width="62" height="6" rx="2" fill="#1E293B"/>
    </g>
    <text x="0" y="36" fill="#94A3B8" class="lcars-data" font-size="9">DRIVE: ODOMETRIC TRAJECTORY • MOTION KINEMATICS</text>
  </g>

  <!-- ==================== RIGHT COLUMN: ENCLOSED STAT CARDS ==================== -->
  <g transform="translate(566, 58)">
    
    <!-- Header Pill -->
    <rect x="0" y="0" width="160" height="18" rx="3" fill="#1E293B"/>
    <text x="10" y="13" fill="#FF9900" class="lcars-mono" font-size="10" letter-spacing="1">STRATEGIC PROFILE</text>

    <!-- Enclosed Stat Card 1 -->
    <g transform="translate(0, 26)">
      <rect x="0" y="0" width="180" height="64" rx="4" fill="#0E1726" stroke="#FF9900" stroke-width="1"/>
      <text x="12" y="18" fill="#64748B" class="lcars-mono" font-size="9">COMMISSION LEVEL</text>
      <text x="12" y="38" fill="#FF9900" class="lcars-heavy" font-size="16" letter-spacing="1">FLEET ADMIRAL</text>
      <text x="12" y="52" fill="#94A3B8" class="lcars-data" font-size="8.5">CLEARANCE: OMEGA-1 // LVL 10</text>
    </g>

    <!-- Enclosed Stat Card 2 -->
    <g transform="translate(190, 26)">
      <rect x="0" y="0" width="180" height="64" rx="4" fill="#0E1726" stroke="#00E5FF" stroke-width="1"/>
      <text x="12" y="18" fill="#64748B" class="lcars-mono" font-size="9">FLEET DIRECTIVES</text>
      <text x="12" y="38" fill="#00E5FF" class="lcars-heavy" font-size="16" letter-spacing="1">06 ARMED</text>
      <text x="12" y="52" fill="#94A3B8" class="lcars-data" font-size="8.5">ALL INITIATIVES NOMINAL</text>
    </g>

    <!-- Enclosed Stat Card 3: Postings -->
    <g transform="translate(0, 98)">
      <rect x="0" y="0" width="370" height="64" rx="4" fill="#0E1726" stroke="#24C7C0" stroke-width="1"/>
      <text x="14" y="20" fill="#64748B" class="lcars-mono" font-size="9">PRIMARY DEPLOYMENT &amp; FLAGSHIP</text>
      <text x="14" y="40" fill="#24C7C0" class="lcars-heavy" font-size="14" letter-spacing="0.5">SECTOR 001 // U.S.S. ENTERPRISE-G</text>
      <text x="14" y="54" fill="#94A3B8" class="lcars-data" font-size="8.5">CONSTITUTION III CLASS // FLAGSHIP COMMAND ARCHIVE</text>
    </g>

    <!-- Bottom Status Line -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="370" height="34" rx="4" fill="#0E1726" stroke="#1E293B" stroke-width="1"/>
      <circle cx="16" cy="17" r="4.5" fill="#24C7C0"/>
      <text x="28" y="21" fill="#FEFEFE" class="lcars-mono" font-size="9.5" letter-spacing="0.5">CONTIGUOUS SENSOR SWEEP: ALL SECTORS NOMINAL</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="20" y="312" width="60" height="4" rx="2" fill="#FF9900"/>
  <rect x="85" y="312" width="220" height="4" rx="2" fill="#00E5FF"/>
  <rect x="310" y="312" width="140" height="4" rx="2" fill="#FFB347"/>
  <rect x="455" y="312" width="40" height="4" rx="2" fill="#FF2A55"/>
  <rect x="500" y="312" width="300" height="4" rx="2" fill="#24C7C0"/>
  <rect x="805" y="312" width="135" height="4" rx="2" fill="#FF9900"/>
</svg>
