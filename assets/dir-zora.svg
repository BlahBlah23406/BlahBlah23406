<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 84" width="100%" height="84" role="img" aria-label="LCARS Directive: Project Zora">
  <defs>
    <style>
      .lcars-mono { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; text-transform: uppercase; }
      .lcars-heavy { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; text-transform: uppercase; }
      .lcars-desc { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="960" height="84" fill="#080C14" rx="6" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Left LCARS Accent Pillar -->
  <path d="M 12 72 L 12 18 A 6 6 0 0 1 18 12 L 28 12 A 3 3 0 0 1 31 15 L 31 69 A 3 3 0 0 1 28 72 Z" fill="#00E5FF"/>

  <!-- Designation Badge -->
  <rect x="38" y="14" width="62" height="22" rx="3" fill="#00E5FF"/>
  <text x="69" y="29" fill="#080C14" class="lcars-heavy" font-size="11" text-anchor="middle" letter-spacing="1">DIR-01</text>

  <!-- Project Title -->
  <text x="110" y="30" fill="#FEFEFE" class="lcars-heavy" font-size="15" letter-spacing="1">PROJECT ZORA</text>

  <!-- Classification Tag -->
  <rect x="250" y="14" width="124" height="22" rx="3" fill="#0E1726" stroke="#00E5FF" stroke-width="1"/>
  <text x="312" y="29" fill="#00E5FF" class="lcars-mono" font-size="9.5" text-anchor="middle" letter-spacing="0.5">LOCAL-AI CORE</text>

  <!-- Right Access Button -->
  <rect x="790" y="14" width="156" height="22" rx="3" fill="#0E1726" stroke="#00E5FF" stroke-width="1"/>
  <text x="868" y="29" fill="#00E5FF" class="lcars-mono" font-size="9.5" text-anchor="middle" letter-spacing="0.5">ACCESS REPOSITORY →</text>

  <!-- Description Body -->
  <text x="38" y="58" fill="#CBD5E1" class="lcars-desc" font-size="12">
    Starfleet-themed personal assistant &amp; bridge console. Dual-LLM cognitive pipeline orchestrating local <tspan fill="#00E5FF" font-weight="600">DeepSeek-R1</tspan> (deep reasoning) and <tspan fill="#00E5FF" font-weight="600">Qwen 2.5</tspan> (structured parsing) with continuous rule evolution.
  </text>
</svg>
